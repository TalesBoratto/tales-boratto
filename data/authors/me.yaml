    start: 2022-12-15
    end: Present
    summary: |
      Conducting research on machine learning for damage detection using
      sensor data, with a focus on federated learning and time-series analysis.
      Developing reproducible Python workflows for data preparation, feature
      engineering, model optimization, and comparative experimental evaluation.
  - role: Gradute Researcher
    org: Federal University of Juiz de Fora
    start: 2020-03-16
    end: 2022-11-16
    summary: |
      Developed a machine learning workflow to classify bronze alloys from audio
      recordings, covering controlled data collection, dataset preparation,
      signal processing, and feature engineering. Evaluated 60 classification
      configurations across five feature sets, achieving 99.75% mean accuracy
      with logistic regression on a controlled experimental dataset. Applied
      feature selection, statistical testing, and error analysis to guide model
      selection, and published findings in peer-reviewed journals and
      international conference proceedings.

