bio: |
  Tales Boratto is a Data Scientist with one year of industry experience developing machine learning solutions for real-world problems. 
  As a PhD candidate in Computational Modeling, he combines hands-on industry experience with a strong research background 
  in Python, machine learning, statistics, and predictive modeling.

  His experience spans data preparation, exploratory data analysis, feature engineering, model optimization, and rigorous experimental evaluation. 
  He focuses on understanding complex problems, extracting meaningful insights from data, and building reliable, reproducible solutions.

